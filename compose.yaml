services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bookshelf
      POSTGRES_PASSWORD: bookshelf_local
      POSTGRES_DB: bookshelf
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - bookshelf_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookshelf -d bookshelf"]
      interval: 3s
      timeout: 3s
      retries: 15
volumes:
  bookshelf_data:
